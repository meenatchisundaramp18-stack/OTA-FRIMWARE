<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmware Flash Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="bg-slate-900 p-8 text-white">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">OTA Deployment Manager</h1>
                    <p class="text-slate-400 text-sm mono mt-1">Status: System Ready // Port: 443</p>
                </div>
                <div class="h-12 w-12 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
            </div>
        </div>

        <div class="p-8">
            <div class="mb-8">
                <label class="block text-sm font-semibold text-slate-700 mb-4 uppercase tracking-wider">Select STM32 Binary (.bin)</label>
                <div id="dropzone" onclick="document.getElementById('fileInput').click()" 
                    class="group border-2 border-dashed border-slate-200 rounded-2xl p-10 text-center hover:border-blue-500 hover:bg-blue-50/50 transition-all cursor-pointer relative">
                    
                    <input type="file" id="fileInput" class="hidden" accept=".bin">
                    
                    <div id="upload-prompt">
                        <div class="bg-slate-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:bg-blue-100 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-500 group-hover:text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                        </div>
                        <p class="text-slate-600 font-medium">Click to browse or drag & drop</p>
                        <p class="text-slate-400 text-xs mt-1">Supports standard STM32 application binaries</p>
                    </div>

                    <div id="file-info" class="hidden text-left bg-slate-50 p-4 rounded-xl border border-slate-200 animate-in fade-in duration-300">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-blue-600 rounded-lg text-white">
                                <span class="text-xs font-bold mono">BIN</span>
                            </div>
                            <div>
                                <p id="file-name" class="font-bold text-slate-800 truncate max-w-[200px]"></p>
                                <p id="file-size" class="text-xs text-slate-500 mono"></p>
                            </div>
                            <div class="ml-auto">
                                <span class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold uppercase">Ready</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Target Hosting URL (GitHub/Server)</label>
                    <input type="text" id="hostUrl" placeholder="https://your-server.com/firmware.bin" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                
                <button onclick="deployFirmware()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-3">
                    Generate OTA Access
                </button>
            </div>

            <div id="result-area" class="hidden border-t border-slate-100 pt-8 flex flex-col items-center">
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm mb-6">
                    <canvas id="qr-canvas"></canvas>
                </div>
                <div class="text-center">
                    <p class="text-sm font-bold text-slate-800 uppercase tracking-widest">ESP32 Scan Node</p>
                    <p class="text-xs text-slate-400 mt-1 mb-4">Alignment: Central | Mode: Direct Fetch</p>
                    <button onclick="window.location.reload()" class="text-xs text-blue-600 font-semibold hover:underline">Clear Session</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('file-info');
        const uploadPrompt = document.getElementById('upload-prompt');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                uploadPrompt.classList.add('hidden');
                fileInfo.classList.remove('hidden');
                document.getElementById('file-name').innerText = file.name;
                document.getElementById('file-size').innerText = (file.size / 1024).toFixed(2) + ' KB';
            }
        });

        function deployFirmware() {
            const hostUrl = document.getElementById('hostUrl').value;
            if(!hostUrl) return alert("Please specify the target hosting URL.");

            document.getElementById('result-area').classList.remove('hidden');
            
            new QRious({
                element: document.getElementById('qr-canvas'),
                size: 220,
                value: hostUrl,
                level: 'H'
            });

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
