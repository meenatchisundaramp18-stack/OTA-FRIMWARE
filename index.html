<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmware Hub | OTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .drop-zone--over { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200">
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">STM32 Firmware Portal</h1>
            <p class="text-blue-100 text-sm mt-1">Deploy updates to your ESP32 bridge instantly</p>
        </div>

        <div class="p-8">
            <div class="mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <span class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center font-bold">1</span>
                    <h2 class="font-semibold text-slate-700">Set Firmware Source</h2>
                </div>
                
                <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center transition-all cursor-pointer hover:border-blue-400">
                    <div class="text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="text-sm">Paste your <b>GitHub Raw Link</b> below</p>
                    </div>
                    <input type="text" id="urlInput" class="mt-4 w-full border border-slate-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://raw.githubusercontent.com/...">
                </div>
            </div>

            <button onclick="processFw()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-4 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 mb-8">
                Generate Update QR
            </button>

            <div id="result-area" class="hidden border-t border-slate-100 pt-8 animate-in fade-in zoom-in duration-300">
                <div class="flex flex-col items-center">
                    <div class="bg-white p-4 border border-slate-200 rounded-2xl shadow-sm mb-4">
                        <canvas id="qr-canvas"></canvas>
                    </div>
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-widest mb-2">Scan with ESP32</p>
                    
                    <div class="flex items-center gap-2 bg-slate-100 p-2 rounded-lg w-full">
                        <code id="display-link" class="text-[10px] text-slate-600 truncate flex-1 px-2"></code>
                        <button onclick="copyLink()" class="bg-white border border-slate-300 text-xs px-3 py-1 rounded shadow-sm hover:bg-slate-50">Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-slate-50 border-t border-slate-200 p-4 text-center">
            <p class="text-[10px] text-slate-400 font-mono">NODE STATUS: <span class="text-green-500">ONLINE</span> | ENCRYPTION: AES-256 READY</p>
        </div>
    </div>

    <script>
        function processFw() {
            const url = document.getElementById('urlInput').value;
            if(!url) {
                alert("Please paste a link first!");
                return;
            }

            document.getElementById('result-area').classList.remove('hidden');
            document.getElementById('display-link').innerText = url;

            new QRious({
                element: document.getElementById('qr-canvas'),
                size: 180,
                value: url,
                level: 'H'
            });

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function copyLink() {
            const link = document.getElementById('display-link').innerText;
            navigator.clipboard.writeText(link);
            alert("Link copied to clipboard!");
        }
    </script>
</body>
</html>
